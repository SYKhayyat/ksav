# Run the tests on every push and pull request.
#
# `release.yml` builds installers when a tag is pushed. Nothing ran on ordinary
# pushes, so nothing has ever been checked by anything but a person remembering
# to — and since there was no remote at all, not even that. The moment a remote
# exists this is the file that starts earning its keep.
#
# Deliberately not the release matrix: this has to be fast enough that people
# wait for it. It builds the engine on Linux and runs everything there, and
# builds it a second time on macOS to run the half a platform can break — see
# the `macos` job for why that is one job rather than a matrix over all of them.
#
# # One checkout
#
# There used to be two. Ksav compiled the shared crates from a **sibling
# checkout** — `girsa-post`, `girsa-source`, `girsa-ksav` reached as
# `path = "../../../sefer-crates/crates/…"`, which on a desk means `Videos/Ksav`
# and `Videos/sefer-crates` side by side. This file checked out one of the two,
# so from the moment Ksav gained those dependencies every Rust job here failed
# at `cargo metadata` with *unable to update …/sefer-crates/crates/girsa-ksav*,
# before reaching a compiler. The remote had just been created, so the very
# first run said so, and the fix was a second `actions/checkout` in four of the
# five jobs here and one more in `release.yml` — five steps whose only purpose
# was to reproduce a desk layout, and which dragged a `path: Ksav` prefix onto
# every `working-directory`, `workspaces` and `cache-dependency-path` in both
# files.
#
# The manifests now pin those crates by commit (`ksav/engine/Cargo.toml`), so
# cargo fetches them like any other dependency and a plain checkout resolves.
# The five steps and the prefix are gone with them. Note what that means for a
# red build: a failure here is now a failure in *this* repository, where before
# a change to the other one could turn this file red without a commit landing
# anywhere near it.
#
# # One runner
#
# No step below spells a check command out. They select a group from
# `ksav/tools/gate.mjs`, which is the one place the gate is written down, and
# `ksav/app/test/gate.test.mjs` fails if a check command reappears as a literal
# here or in any living page.
#
# That is not tidiness. This file used to hold nine check steps and the README
# listed six commands beside them, and for four consecutive pushes the *only*
# red job on `main` was `formatting` — eleven seconds, first step, while every
# other job went green — with fifty-four unformatted hunks accumulating under
# it. A gate nobody can run in one command is a gate that gets read as a
# suggestion.
#
# The jobs stay separate because their costs differ by orders of magnitude:
# `formatting` needs no build, no cache and no system libraries and answers in
# seconds instead of queueing behind the Typst compiler. Splitting the *run* is
# not the same as splitting the *list*.

name: ci

on:
  push:
    branches: ["**"]
    # Tags too, and this used to say `tags-ignore: ["v*"] # tags are
    # release.yml's job`. That was true and it was the wrong conclusion:
    # `release.yml` builds installers and `deploy.yml` publishes the site, and
    # **neither ran a single test**. So the one commit in this repository that
    # gets handed to other people was the one commit nothing checked. Every
    # other push was tested; a release was not.
    tags: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same branch. There is no
  # value in finishing a check of code that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: editor
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ksav/app/package-lock.json
      - name: Install
        working-directory: ./ksav/app
        run: npm ci
      - name: Check
        working-directory: ./ksav
        run: node tools/gate.mjs editor
      - name: Build
        working-directory: ./ksav/app
        run: npx vite build

  engine:
    name: engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The workspace builds the whole Typst compiler, which is not a quick
      # compile from cold.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/engine -> target"
          # Keep the build even when the run goes red.
          #
          # The default throws it away, and on this job that is the expensive
          # thing in the whole workflow: a failing test run discards the
          # compilation and the *next* run — the one with the fix in it — pays
          # for it again from scratch. Nothing about a red test makes the object
          # files wrong.
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Lints then tests, and the tests in release: compiling documents through
      # a debug Typst is slow enough to matter here, and nowhere else. That is
      # the whole reason the runner takes `--release` rather than deciding a
      # profile for everybody.
      #
      # `--release` brings `lto = "thin"` with it, and that is what made this job
      # seventy-five minutes long. There are forty integration test files, so
      # cargo builds forty binaries, and each one statically links the whole
      # Typst compiler — forty whole-program optimisation passes over the same
      # compiler, every push. The log is unambiguous about it: the dependency
      # cache restores in ten seconds, fifteen crates compile, and then
      # seventy-three and a half minutes pass with nothing being compiled at all.
      # Clippy is 31 seconds and the tests themselves are eleven.
      #
      # Both names, because the two profiles cargo could be using here disagree
      # with each other and the measurement disagrees with the documentation —
      # see the long note in `engine/Cargo.toml`, where the `[profile.bench]`
      # form of this was tried and moved the number by 34 seconds. Naming both
      # costs nothing and removes the question.
      #
      # This is a build setting, not a check. `opt-level = 3` is untouched, so
      # the reason `--release` is here in the first place survives; what goes is
      # an optimisation pass whose only product is a faster binary. The shipped
      # desktop application is unaffected either way — it is built from
      # `app/src-tauri`, a separate package, and cargo honours only the profile
      # of the package it is building, so `src-tauri/Cargo.toml` carries its own
      # `lto = "thin"` and this variable never reaches it.
      - name: Check
        working-directory: ./ksav
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_BENCH_LTO: "false"
        run: node tools/gate.mjs engine --release

  # Formatting, across every Rust tree in this repository.
  #
  # The engine job has been installing `rustfmt` as a component since it was
  # written and has never once invoked it, while this tree carried 111
  # unformatted hunks. So the two halves of one product disagreed about whether
  # formatting is a gate — and the half with the working remote was the
  # unformatted one. Girsa gates `cargo fmt -- --check`; this is the other half
  # of that agreement.
  #
  # Its own job because it needs no build, no cache and no system libraries: it
  # answers in seconds instead of queueing behind the Typst compiler. It used to
  # need the sibling checkout anyway, because `cargo fmt` resolves the manifest
  # before it formats anything — which is a fair summary of how far up the stack
  # that path dependency reached.
  fmt:
    name: formatting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # All three Rust trees. `prototypes/flutter-app/rust` is deliberately
      # absent: nothing in this file builds, tests or ships it, and gating an
      # abandoned prototype would be a red nobody can act on.
      - name: Check
        working-directory: ./ksav
        run: node tools/gate.mjs fmt

  # The other platform this ships to, checked rather than assumed.
  #
  # Everything above runs on Linux, and until this job existed that was the whole
  # of what any push proved. macOS appeared in exactly one place — the release
  # matrix — where it is *built* and never run, so "runs on Linux, macOS and
  # Windows" was a claim resting on a compiler exiting zero on tag day. The
  # README says it in the present tense on every other day of the year.
  #
  # This runs the engine group, which is where a platform difference would
  # actually live: paths, the filesystem, the `git` on the machine, the loopback
  # desk, the deep-link scheme. The editor suite is Node and the same Node, and
  # the fonts are compiled into the binary — those two are why this is one job
  # and not a matrix over every job above.
  #
  # Windows is not here and is not an oversight: it is the desk this is written
  # on, so it is checked before every push by the same gate, and a runner would
  # be paying for a third copy of the slowest job in the file to learn what the
  # commit already knows.
  macos:
    name: engine on macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both, because `engine` names a group *and* a tree and the union
          # runs — so this selects `cargo fmt` along with the tests. Written
          # with `clippy` alone first, and `gate.test.mjs` said so by name
          # before a runner ever saw it.
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/engine -> target"
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The same command and the same reason as the Linux engine job: forty test
      # binaries, each statically linking the whole Typst compiler, and the
      # optimisation pass is the only thing this turns off.
      - name: Check
        working-directory: ./ksav
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_BENCH_LTO: "false"
        run: node tools/gate.mjs engine --release

  wasm:
    name: browser engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/wasm -> target"
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ksav/app/package-lock.json
      # wasm-pack's own installer, rather than `jetli/wasm-pack-action`.
      #
      # That action is a JavaScript action pinned to the Node 20 runtime, which
      # GitHub is removing, and its newest release is from 2023 — so it was
      # named in the deprecation annotation on every run of this workflow and
      # nothing upstream is going to fix it. What it does underneath is run this
      # script, which fetches the prebuilt binary for the runner; doing it here
      # is the same install with one fewer third party in the chain.
      - name: Install wasm-pack
        run: curl -sSfL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # The in-browser build is one of the three ways Ksav ships, and it was the
      # only one nothing checked: `app/src/wasmpkg/` is git-ignored and built
      # locally, so the whole no-server path could break and every job here would
      # still be green. Building it is most of the value — `wasm32-unknown-unknown`
      # is a genuinely different target, and the engine reaching for threads, the
      # filesystem or the clock fails here and nowhere else.
      - name: Build the wasm engine
        working-directory: ./ksav/wasm
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Install
        working-directory: ./ksav/app
        run: npm ci

      # `build:wasm` is the offline bundle, and it is a different Vite graph from
      # the default build: the worker chunk and the engine module are only pulled
      # in when VITE_WASM=1, so the default build passing says nothing about it.
      - name: Bundle the offline build
        working-directory: ./ksav/app
        run: |
          mkdir -p src/wasmpkg
          cp ../wasm/pkg/ksav_wasm.js ../wasm/pkg/ksav_wasm.d.ts src/wasmpkg/
          cp ../wasm/pkg/ksav_wasm_bg.wasm ../wasm/pkg/ksav_wasm_bg.wasm.d.ts src/wasmpkg/
          npm run build:wasm

      # Proves the module actually runs, not merely that it linked: compile every
      # bundled template through the wasm engine and check the spell-checker
      # answers. A wasm binary that instantiates and then panics on first use
      # would pass every step above this one.
      - name: Run the engine
        working-directory: ./ksav/app
        run: node ../../.github/scripts/wasm-smoke.mjs

  # The half of the process that was missing.
  #
  # Every job above this one checks a part. This one boots the product — the
  # real SPA embedded in the real server — and drives a real Chrome through the
  # first ten minutes of using it: a sefer from the ספר template, a heading, a
  # bulleted list, a table and a row in it, a footnote with a gershayim inside
  # parentheses, an endnote, and a PDF out the other end.
  #
  # It is the slowest job here and that is inherent: `embed-ui` needs the app
  # built first, and the server is a release build of the Typst compiler. The
  # cache is shared with the `engine` job's workspace, so the dependencies are
  # warm and only the final crate relinks.
  #
  # No browser is downloaded. `playwright-core` drives the Chrome the runner
  # already has, which is why the app's devDependencies grew by 14 MB and not by
  # 150 — see the header of the script.
  acceptance:
    name: the assembled app
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ksav/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/engine -> target"
          # Keep the build even when the run goes red.
          #
          # The default throws it away, and on this job that is the expensive
          # thing in the whole workflow: a failing test run discards the
          # compilation and the *next* run — the one with the fix in it — pays
          # for it again from scratch. Nothing about a red test makes the object
          # files wrong.
          cache-on-failure: true

      - name: Install
        working-directory: ./ksav/app
        run: npm ci

      # `dist/` is git-ignored and `include_dir!` reads it at compile time, so
      # this order is a hard dependency and not a preference: building the server
      # first fails inside a proc macro with a message about a missing directory.
      - name: Build the app
        working-directory: ./ksav/app
        run: npm run build

      - name: Build the server with the app inside it
        working-directory: ./ksav/engine
        run: cargo build --release --features embed-ui

      - name: Use it
        working-directory: ./ksav/app
        run: npm run accept

  emacs:
    name: the Emacs package
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/engine -> target"
          # Keep the build even when the run goes red.
          #
          # The default throws it away, and on this job that is the expensive
          # thing in the whole workflow: a failing test run discards the
          # compilation and the *next* run — the one with the fix in it — pays
          # for it again from scratch. Nothing about a red test makes the object
          # files wrong.
          cache-on-failure: true

      # `emacs-nox` rather than the full package: this suite runs in batch and
      # draws nothing. The one thing a graphical Emacs would add — actually
      # rasterising an SVG page — is not something a headless runner can check
      # either way, and `ksav.el` says so in words to a reader whose Emacs
      # cannot do it rather than showing them an empty buffer.
      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox

      # For the packaging step at the end of this job. Declared rather than
      # taken from whatever the runner image ships, for the same reason the
      # rustup components are.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The engine, because half of these tests drive a real one: a real Typst
      # compile, a real PDF, the real Hebrew speller. Without it that half skips,
      # and `KSAV_EMACS_LIVE` below turns the skip into an error so it cannot
      # quietly stop running here — which is the whole reason this job exists
      # rather than the offline half being considered enough.
      - name: Build the engine
        working-directory: ./ksav/engine
        run: cargo build --release

      # A byte-compile warning in an elisp package is what a `tsc` error is in the
      # editor: it compiles either way, and the warning is the only thing that
      # will ever mention a free variable or a function that is not there.
      #
      # **Before** the tests, and that ordering was paid for. `ksav.el` used
      # `string-replace`, which is Emacs 28; this package declares 27.1, which is
      # what this runner has and what the declaration is *for*. The ERT run
      # failed with a `void-function` backtrace inside a `let` inside an
      # `unwind-protect`; the byte compiler says the name and the line.
      - name: Byte-compile it
        working-directory: ./ksav/editors/emacs
        run: |
          emacs --version | head -1
          # Every `.el` in the directory, not a list of three. The list was
          # written when there were three and a fourth arrived generated, which
          # is exactly when a hand-kept list stops covering the file most likely
          # to be wrong.
          emacs -Q --batch -L . --eval '(setq byte-compile-error-on-warn t)' \
                -f batch-byte-compile ./*.el
          rm -f ./*.elc

      - name: Run the package's tests
        working-directory: ./ksav/editors/emacs
        env:
          KSAV_EMACS_LIVE: "1"
        run: |
          export PATH="$GITHUB_WORKSPACE/ksav/engine/target/release:$PATH"
          emacs -Q --batch -L . -l ksav.el -l ksav-tests.el \
                -f ert-run-tests-batch-and-exit

      # And then install it the way a person would.
      #
      # Every step above this one runs the package **out of the checkout**, with
      # `-L .` pointing at the source tree. That is not how anybody gets it, and
      # it cannot see the thing most likely to be wrong with a package: what is
      # and is not in the tarball. A file left out of `PACKAGE_FILES` — a newly
      # generated one, say — passes the byte-compile and the whole ERT suite
      # here and fails on the first machine that installs it, with a
      # `void-function` for something that is right there in the repository.
      #
      # So the tarball is built and handed to `package-install-file` in a clean
      # batch Emacs, and the package is required from the *installed* copy.
      # Deliberately not a listing of the archive's contents: that asks whether
      # the file is present, and the question is whether the package loads.
      #
      # On every push rather than only on a tag. Packaging that is exercised
      # once per release is packaging that is broken on release day, and
      # `release.yml` runs this same check immediately before uploading it.
      - name: Build the tarball and install it into a clean Emacs
        shell: bash
        run: |
          dir="$(node ksav/app/tools/emacs-package.mjs "$RUNNER_TEMP/elpa")"
          tar -cf "$RUNNER_TEMP/pkg.tar" -C "$RUNNER_TEMP/elpa" "$(basename "$dir")"
          emacs -Q --batch --eval '(progn
            (require (quote package)) (package-initialize)
            (package-install-file "'"$RUNNER_TEMP"'/pkg.tar")
            (require (quote ksav))
            (unless (fboundp (quote ksav-install-engine))
              (error "installed, and ksav-install-engine is not there")))'

  # The same package on a current Emacs, because the job above runs 27.1 and
  # 27.1 only.
  #
  # 27.1 is what this package declares in `Package-Requires`, and pinning the
  # runner to the declared floor is the right way to prove the floor is real. It
  # also means the version almost every reader actually has is the one version
  # nothing here executes — so a behaviour that changed after 27.1 is invisible,
  # and one did. `url-retrieve-synchronously' against a port with no listener
  # returns a live buffer with an empty body on GNU/Linux under 30.2, and nil
  # under 27.1. `ksav-running-p' read that buffer as an engine, so `ksav-start'
  # started nothing and every call failed with `no reply'. The package was
  # unusable on a current Emacs while all fifty tests here were green.
  #
  # No engine and no `KSAV_EMACS_LIVE', so the fifteen live tests skip and this
  # costs an apt install rather than a Typst compile. That is not a gap: the
  # assertion that catches this class — `ksav-nothing-listening-is-not-an-engine-running`
  # — needs no engine by construction, because the fault is that no engine gets
  # started. The live half is covered above, at the floor.
  emacs-current:
    name: the Emacs package, current Emacs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Emacs
        run: sudo apt-get update && sudo apt-get install -y emacs-nox
      # And it has to actually be a different Emacs.
      #
      # This job's entire value is that it is not the declared floor. A runner
      # image that shipped 27.1 would make it a second, slower copy of the job
      # above, green and meaningless — which is the shape of every skip this
      # repository has had to go back and fix. So the version is asserted rather
      # than printed and trusted.
      - name: It is not the version the floor job runs
        run: |
          version="$(emacs -Q --batch --eval '(princ emacs-version)')"
          echo "emacs $version"
          case "$version" in
            27.*)
              echo "This runner ships Emacs $version, which is the floor \`ci.yml\`"
              echo "already tests. This job then proves nothing. Move it to a"
              echo "runner image with a newer Emacs."
              exit 1
              ;;
          esac

      - name: Run the offline half
        working-directory: ./ksav/editors/emacs
        run: |
          emacs -Q --batch -L . --eval '(setq byte-compile-error-on-warn t)' \
                -f batch-byte-compile ./*.el
          rm -f ./*.elc
          emacs -Q --batch -L . -l ksav.el -l ksav-tests.el \
                -f ert-run-tests-batch-and-exit

      # What MELPA will run, run here instead of by hand once.
      #
      # `melpa-recipe' in this directory is a submission waiting to be opened,
      # and the checklist on that pull request asks for a clean `package-lint'
      # and a `checkdoc' pass. Both were clean when the recipe was written,
      # which is worth exactly as much as any other measurement nothing repeats:
      # every one of these files is edited regularly and two of them are
      # generated.
      #
      # `package-lint-main-file' is not optional here. Without it each file is
      # linted as though it were its own package, so every definition in
      # `ksav-write.el' is reported for not starting with `ksav-write-', and the
      # `Package-Requires' header — which lives in `ksav.el' alone — is invisible,
      # so 27.1 features are reported as needing a dependency the package already
      # declares. That reads as forty errors in a package that has none.
      - name: package-lint and checkdoc, as MELPA asks for them
        working-directory: ./ksav/editors/emacs
        run: |
          emacs -Q --batch --eval '(progn
            (require (quote package))
            (add-to-list (quote package-archives)
                         (quote ("melpa" . "https://melpa.org/packages/")) t)
            (package-initialize)
            (package-refresh-contents)
            (package-install (quote package-lint)))'
          emacs -Q --batch --eval '(progn
            (require (quote package)) (package-initialize)
            (require (quote package-lint))
            (setq package-lint-main-file "ksav.el"))' \
            -L . -f package-lint-batch-and-exit \
            ksav.el ksav-engine.el ksav-girsa.el ksav-git.el \
            ksav-preview.el ksav-write.el ksav-services.el ksav-release.el
          # checkdoc reports and exits 0, so the output is the test.
          for f in ksav*.el; do
            [ "$f" = "ksav-tests.el" ] && continue
            emacs -Q --batch -L . --eval "(progn (require 'checkdoc) (checkdoc-file \"$f\"))"
          done 2>&1 | grep -v '^Warning (emacs): $' | tee /tmp/checkdoc.out
          if [ -s /tmp/checkdoc.out ]; then
            echo "checkdoc has something to say — see above"
            exit 1
          fi

  desktop:
    name: desktop shell
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      # libappindicator3-dev and libayatana-appindicator3-dev CONFLICT: the
      # ayatana package Replaces: the old one, so asking for both makes apt exit
      # 100 and the job never reaches a compiler. Tauri v2 wants ayatana; install
      # only that. (The Docker packaging script already learned this; this file
      # had not.)
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev
      # Both components named, because this job's checks now need both and the
      # runner image happening to carry them is not a declaration. `clippy` ran
      # here for weeks on nothing but that luck.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/app/src-tauri -> target"
          cache-on-failure: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Compiles the Tauri commands, lints them, formats them, and runs the
      # path-allowlist and deep-link tests. The bundlers are release.yml's job;
      # this only has to prove the shell builds. Clippy came with the runner —
      # it was gated on one of the three Rust trees, the same shape as the
      # formatting gap.
      #
      # `shell` names a tree, so it selects `fmt-shell` as well. The overlap
      # with the `formatting` job is deliberate and it is cheap — one second of
      # a three-minute job — and it buys the property that a name reading
      # "check the shell" checks the shell. `formatting` stays a separate job
      # because it is the *faster answer*, not because it is the only one.
      - name: Check
        working-directory: ./ksav
        run: node tools/gate.mjs shell
