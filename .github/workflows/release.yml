# Build everything Ksav ships and attach it to a GitHub release: the desktop
# app for Windows, macOS and Linux, the engine as a standalone binary, and the
# Emacs package as an installable tarball.
#
# Why this exists: a bochur cannot install Ksav today, and that — not any missing
# feature — is the largest single reason to keep using Word. The bundlers were
# already configured in `tauri.conf.json`; nothing had ever run them.
#
# macOS is the only platform that *needs* CI. Windows and Linux installers can be
# produced locally (Linux through Docker over WSL), but a .dmg cannot be
# cross-built, so it can only come from a macOS runner.
#
# # The other two things Ksav is
#
# For a long time this file's answer to "how do I get Ksav" was four desktop
# installers, and that answer was incomplete in a way that was invisible from
# here. The desktop shell links the engine as a *library*, so installing the
# application put no `ksav` program anywhere on the machine — and the engine is
# the product. Anybody who wanted Ksav without the Tauri shell (an Emacs user, a
# script, a server, a person on a machine the shell does not build for) was told
# to run `cargo build --release`, which is a compile of the whole Typst
# compiler.
#
# So `engine` below attaches the binary itself, per platform, built with the web
# editor inside it — the same `--features embed-ui` build the acceptance job
# runs, so one downloaded file is the whole product: `ksav serve` and a browser,
# or `ksav document.ksav` and a PDF, or an editor talking to it over HTTP.
#
# And `elisp` attaches `editors/emacs` as a tarball that `M-x
# package-install-file` accepts, because until it did, every route into that
# package began "clone the monorepo".
#
# Trigger: push a tag, e.g.  git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # builds everything and publishes nothing; see `tagName`

jobs:
  # Nothing was checked before the installers were built.
  #
  # `ci.yml` skipped tags on the stated grounds that "tags are release.yml's
  # job", and release.yml ran no tests at all — so the one commit in this
  # repository that is handed to other people, as four signed installers and a
  # published website, was the only commit nothing had ever tested. Every
  # ordinary push was.
  #
  # `ci.yml` runs on tags now as well, and this job is still worth its two
  # minutes: it is a *gate*, on this checkout, and the matrix below does not
  # start until it passes. Without it a red CI run and a successful release race
  # each other, and the release usually wins.
  #
  # One platform and the fast half of the suite, deliberately. This is here to
  # stop an obviously broken tag, not to re-run the whole of CI in a second file.
  check:
    name: check before shipping
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ksav/app/package-lock.json
      - name: Install
        working-directory: ./ksav/app
        run: npm ci
      # Groups of `ksav/tools/gate.mjs`, which is the one place a check command
      # is written down. See the header of `ci.yml`.
      - name: Check the editor
        working-directory: ./ksav
        run: node tools/gate.mjs editor
      # `engine` names a tree, so it selects the engine's formatting check as
      # well as its lints and tests. Both components declared rather than
      # inherited from whatever the runner image happens to carry.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/engine -> target"
      # The engine, in release, because a debug Typst lays documents out slowly
      # enough to change what this step costs. `opt-level = 3` is the whole of
      # that reason, and it is untouched; the link-time optimisation is turned
      # off here for the same reason `ci.yml` turns it off, where the long note
      # and the measurement live. Forty test binaries, each an LTO pass over the
      # whole Typst compiler, is seventy-five minutes of a release.
      - name: Check the engine
        working-directory: ./ksav
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_BENCH_LTO: "false"
        run: node tools/gate.mjs engine --release

  build:
    needs: check
    permissions:
      contents: write # to create the release and upload the installers
    strategy:
      fail-fast: false # one platform failing must not hide the other two
      matrix:
        include:
          - platform: windows-latest # .msi (WiX) + .exe (NSIS)
            args: ""
          - platform: ubuntu-22.04 # .deb + .AppImage
            args: ""
          # Both Mac architectures. Apple Silicon is the one a student is most
          # likely to have; Intel Macs are still everywhere in yeshivos.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      # One checkout. There were two, side by side, because Ksav reached the
      # shared crates as `../../../sefer-crates/crates/…` and a lone checkout of
      # this repository could not resolve `girsa-post`, `girsa-source` or
      # `girsa-ksav` — `cargo metadata` failed before any compiler ran. This file
      # checked out one of the two, which meant the next tag pushed would have
      # produced no installers on any of the four targets; `ci.yml` had the same
      # hole and hit it first, and nothing had noticed because neither had ever
      # run. The manifests now pin those crates by commit, so cargo fetches them
      # like any other dependency. See `ksav/engine/Cargo.toml`.
      - uses: actions/checkout@v7

      # webkit2gtk is the webview Tauri renders into on Linux; the ayatana
      # appindicator and librsvg are what the .deb and .AppImage bundlers link
      # against. Only the ayatana package: it Replaces: libappindicator3-dev, so
      # asking apt for both is a conflict that exits 100 before anything builds.
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || contains(matrix.args, 'x86_64-apple') && 'x86_64-apple-darwin' || '' }}
          # For the engine check below, which selects the engine tree's
          # formatting and lints along with its tests.
          components: clippy, rustfmt

      # The Rust cache is worth having: this workspace builds the whole Typst
      # compiler, which is not a quick compile from cold.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/app/src-tauri -> target"

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install front-end dependencies
        working-directory: ./ksav/app
        run: npm ci

      # Cheap, and it fails the build before a 20-minute Rust compile if the
      # editor code is broken.
      - name: Check the editor
        working-directory: ./ksav
        run: node tools/gate.mjs editor

      # Same setting, same reason as the job above and as `ci.yml`. Note that it
      # reaches only this check: `tauri-action` below builds `app/src-tauri`,
      # which is a separate package with its own `[profile.release]`, and cargo
      # honours only the profile of the package it is building. The installer is
      # linked exactly as it was.
      - name: Check the engine
        if: matrix.platform == 'ubuntu-22.04'
        working-directory: ./ksav
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_BENCH_LTO: "false"
        run: node tools/gate.mjs engine --release

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is not configured. Unsigned, Windows SmartScreen shows
          # "unrecognized app" and macOS says "unidentified developer" — a real
          # adoption cost, and the honest fix is a certificate ($99/yr Apple,
          # ~$200-400/yr Windows OV), not a workaround. Add the secrets and
          # these become signed builds with no other change:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID       (notarisation)
          #   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD
          #   TAURI_SIGNING_PRIVATE_KEY (updater)
          # The same table is in the root README, under Download, so somebody
          # deciding whether to spend the money can see what it buys without
          # reading a workflow file.
        with:
          projectPath: ./ksav/app
          # Empty on anything that is not a tag, which is what makes
          # `workflow_dispatch` mean what it says. `tauri-action` documents the
          # pair: *"If you only want to build the app without having the action
          # upload any assets … simply omit `tagName`, `releaseName` and
          # `releaseId`."* So a dispatch builds all four installers and creates
          # nothing.
          #
          # This was `github.ref_name` unconditionally, which on a dispatch from
          # `main` is the string `main` — so the one documented way to rehearse a
          # release cut a release named "Ksav main", tagged `main`, and the two
          # `gh release upload` steps below filled it with installers. A draft
          # rather than a public release, because `releaseDraft` is true below,
          # which made it quiet rather than harmless.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Ksav {0}', github.ref_name) || '' }}
          # The installers are unsigned, so every operating system shows a scary
          # warning the first time. Saying nothing here is what actually costs
          # adoption: the writer concludes the download is broken and goes back to
          # Word. Until there is a certificate, the next best thing is telling
          # them exactly which button to press.
          releaseBody: |
            **Pick the file for your system**

            | System | File |
            | --- | --- |
            | Windows | `.msi` (or `.exe`) |
            | macOS, Apple Silicon (M1–M4) | `_aarch64.dmg` |
            | macOS, Intel | `_x64.dmg` |
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (anything else) | `.AppImage` |

            **These installers are not code-signed, so the first launch is blocked.**
            Nothing is wrong with the download — a signing certificate costs money
            Ksav has not spent yet. To get past it:

            - **Windows** — SmartScreen says "Windows protected your PC". Click
              **More info**, then **Run anyway**.
            - **macOS** — the app is blocked as coming from an unidentified
              developer. Open **System Settings → Privacy & Security**, scroll to
              the message about Ksav, and press **Open Anyway**. If macOS instead
              claims the app "is damaged", clear the download quarantine flag:
              `xattr -dr com.apple.quarantine /Applications/Ksav.app`
            - **Linux** — for the `.AppImage`, mark it executable first:
              `chmod +x Ksav_*.AppImage`

            Ksav keeps your documents in the app's own storage on your machine, and
            nothing is uploaded anywhere. Use **File → Save a copy** to keep a
            `.ksav` file of your own.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Which engines to build, read out of the one table that names them.
  #
  # `ksav/app/tools/emit-release-assets.mjs` holds the platform list, generates
  # `editors/emacs/ksav-release.el` from it, and prints this matrix. So the
  # workflow that uploads an asset and the elisp that downloads it cannot
  # disagree about what it is called — which is the fifth instance in this
  # repository of one table written twice, and the previous four all drifted
  # silently.
  targets:
    name: which engines to build
    needs: check
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: read
        working-directory: ./ksav/app
        run: echo "matrix=$(node tools/emit-release-assets.mjs --matrix)" >> "$GITHUB_OUTPUT"

  # The engine, as a program somebody can run.
  #
  # `needs: build` rather than running beside it: `tauri-action` is what creates
  # the release these upload into, so starting before it means `gh release
  # upload` has no release to find.
  engine:
    name: engine for ${{ matrix.target.id }}
    needs: [build, targets]
    permissions:
      contents: write # to attach the binaries to the release
    strategy:
      fail-fast: false # one platform failing must not hide the others
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ksav/app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/engine -> target"
          cache-on-failure: true

      - name: Install front-end dependencies
        working-directory: ./ksav/app
        run: npm ci

      # `dist/` is git-ignored and `include_dir!` reads it at compile time, so
      # this order is a hard dependency and not a preference: building the
      # engine first fails inside a proc macro with a message about a missing
      # directory.
      - name: Build the app
        working-directory: ./ksav/app
        run: npm run build

      # With the editor inside it, so the downloaded file is the whole product
      # and not half of it. A binary that can compile a document but cannot show
      # anybody the page is a strange thing to hand someone as "Ksav".
      - name: Build the engine with the editor inside it
        working-directory: ./ksav/engine
        run: cargo build --release --features embed-ui --bin ksav --target ${{ matrix.target.triple }}

      # It has to *run*, not merely link. A cross-compiled binary that starts and
      # dies is the failure this catches, and `--version` is the cheapest thing
      # that proves a process got as far as its own main. Skipped where the
      # binary is not for this machine, which is only the Intel macOS build.
      - name: Run it
        if: matrix.target.triple != 'x86_64-apple-darwin'
        shell: bash
        run: ksav/engine/target/${{ matrix.target.triple }}/release/${{ matrix.target.built }} --version

      # Only on a tag. Everything above it — the build, the matrix, the
      # toolchain — still runs on a dispatch, which is the point of one.
      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "ksav/engine/target/${{ matrix.target.triple }}/release/${{ matrix.target.built }}" \
             "${{ matrix.target.asset }}"
          gh release upload "${{ github.ref_name }}" "${{ matrix.target.asset }}" --clobber

  # The Emacs package, as a tarball `M-x package-install-file` accepts.
  elisp:
    name: the Emacs package
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Emacs
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update && sudo apt-get install -y emacs-nox

      - name: Build the tarball
        id: pack
        shell: bash
        run: |
          dir="$(node ksav/app/tools/emacs-package.mjs "$RUNNER_TEMP/elpa")"
          tar -cf "$RUNNER_TEMP/$(basename "$dir").tar" -C "$RUNNER_TEMP/elpa" "$(basename "$dir")"
          echo "tar=$RUNNER_TEMP/$(basename "$dir").tar" >> "$GITHUB_OUTPUT"

      # Installed, not inspected. `ci.yml` runs this same check on every push —
      # see the long note there for why a listing of the tarball's contents is
      # not the same question.
      - name: Install it into a clean Emacs
        run: >
          emacs -Q --batch --eval
          '(progn (require (quote package)) (package-initialize)
                  (package-install-file "${{ steps.pack.outputs.tar }}")
                  (require (quote ksav))
                  (unless (fboundp (quote ksav-install-engine))
                    (error "installed, and ksav-install-engine is not there")))'

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "${{ steps.pack.outputs.tar }}" --clobber
