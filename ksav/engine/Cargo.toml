[package]
name = "ksav-engine"
version = "0.1.0"
edition = "2021"
description = "Hebrew-first typesetting engine built on real Typst compilation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SYKhayyat/ksav"
# The six fonts under assets/fonts are separately licensed (OFL 1.1 / GUST);
# see THIRD-PARTY-NOTICES.md at the repository root.

[lib]
name = "ksav_engine"
path = "src/lib.rs"

[[bin]]
name = "ksav"
path = "src/main.rs"

[dependencies]
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
typst-html = "0.15"
typst-as-lib = { version = "0.16", features = ["typst-html"] }
ecow = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# What is a Hebrew mark, a Hebrew letter, a prefix, a geresh — for `src/spell/`.
#
# **Unconditional, unlike the three below.** The speller runs in the browser
# build, and this crate is pure character tables with no I/O; gating it with the
# loopback would leave the browser with the wrong answer about maqaf, which is
# where this whole seam started.
#
# **Zero new supply chain.** It was already in the binary — `girsa-source` →
# `girsa-ref` → `girsa-hebrew`, resolved in `Cargo.lock` — and nothing here
# referenced it, so the correct definition of a word boundary shipped inside
# Ksav for months while `spell/hebrew.rs` used a wrong one it had written out
# by hand.
girsa-hebrew = { version = "=0.5.3", git = "https://github.com/SYKhayyat/sefer-crates", rev = "d869ccc5251e6168f7e42dbc1db094a5cd631047" }

include_dir = { version = "0.7", optional = true }
# Typst's own editor-support crate, for `src/jump.rs`. It is what turns a click
# on the page into a place in the source and back, by walking the laid-out frames
# for the span each glyph came from. Nothing else can answer that question: the
# spans exist only inside a compiled document, and the alternative — guessing
# from the scroll position — is what this replaced.
typst-ide = "0.15"

# The HTTP server (net + threads) is native-only; wasm builds skip it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
# Reading the flavour Girsa put down. The **same** library Girsa writes it with,
# and the same version: the two applications are reading and writing one native
# clipboard format, and a difference in how it is registered would show up as
# "sometimes it pastes as plain text". See `src/clipboard.rs` for why a webview
# cannot do this and the engine has to.
clipboard-rs = { version = "0.3.5", default-features = false }

# --- the shared crates, from the sefer-crates repository --------------------
#
# Girsa is the library; Ksav is the pen. `sefer-crates` is not a library either
# of them merely uses — it is the seam between the two halves of one product,
# so that a change to what a quote block *is* lands on both sides as one edit
# instead of an agreement in prose between two repositories (spec.md §10.3).
#
# **A git dependency and not a path.** These were `path =
# "../../../sefer-crates/crates/…"` — resolved from `ksav/engine/`, that is a
# sibling of the *checkout root*, so `git clone ksav && cargo build` failed at
# `cargo metadata`, before a compiler ran, with a message naming a directory
# the reader had never heard of. Not one `.md` in the repository said so. Four
# of `ci.yml`'s five jobs and the release matrix carried a second
# `actions/checkout` purely to fake the desk layout, which is what a
# load-bearing workaround looks like, and `ci.yml`'s own first run is the record
# of it. `packaging/build-linux.sh` had no such workaround and could not have
# produced an installer: it mounts this repository alone, so `girsa-post`
# resolved to `/sefer-crates` inside the container.
#
# **`rev` and not `version` is the pin.** `= 0.5.0` beside a path read as a pin
# and was not one: with a path dependency the path always wins and there is no
# version to fall back to. A commit SHA is the pin that `= 0.5.0` was
# pretending to be, and the exact-version requirement is kept beside it so that
# a rev whose manifests say something else is a resolution error rather than a
# surprise. Bumping is deliberate, which was the original intent: edit the rev
# here and in `app/src-tauri/Cargo.toml`, and `tests/manifests.rs` fails if the
# two ever disagree — one product must not compile two sefer-crates.
#
# **Editing both halves at once.** That is what the path dependency really
# bought, and it is kept: copy `.cargo/config.toml.example` to
# `.cargo/config.toml` at the repository root and a local `sefer-crates`
# checkout overrides the git one for every crate here. See `ksav/README.md`,
# "The shared crates".
#
# **Native-only.** `girsa-post` is the token-gated localhost loopback to Girsa;
# a browser build has no listener and nothing to be handed a source by.
# `girsa-source` and `girsa-ksav` sat in the unconditional block, so the
# offline browser build compiled the packet schema and the citation writer for
# an application that is not there — `src/source.rs`, their only consumer here,
# is reached exclusively through `post.rs` and is gated with them.
girsa-source = { version = "=0.5.3", git = "https://github.com/SYKhayyat/sefer-crates", rev = "d869ccc5251e6168f7e42dbc1db094a5cd631047" }
girsa-ksav = { version = "=0.5.3", git = "https://github.com/SYKhayyat/sefer-crates", rev = "d869ccc5251e6168f7e42dbc1db094a5cd631047" }
girsa-post = { version = "=0.5.3", git = "https://github.com/SYKhayyat/sefer-crates", rev = "d869ccc5251e6168f7e42dbc1db094a5cd631047" }
# Named, at last, and for the reason its `redirect` module was written: refs
# travel between the two applications and get stored in Ksav documents, so when
# upstream re-segments a text the pen is the one holding the old name. It was
# already in the binary through `girsa-source`, and `RedirectTable` — the type
# that carries *this ref is over there now* — had no consumer in either
# application. See `post::refresh` and `girsa_ksav::retargeted`.
girsa-ref = { version = "=0.5.3", git = "https://github.com/SYKhayyat/sefer-crates", rev = "d869ccc5251e6168f7e42dbc1db094a5cd631047" }

[features]
# Embed the built SPA (ksav/app/dist) into the binary. Build the app first
# (`npm run build` in ksav/app), then `cargo build --features embed-ui`. That
# order is not advice: `dist/` is git-ignored, so on a clone the embedding fails
# inside `include_dir!` with a message about a directory rather than about the
# step that was skipped — which made the first command in the root README the
# second way this repository did not build from a clone. `build.rs` says so in
# words now.
embed-ui = ["dep:include_dir"]

[profile.dev]
opt-level = 1        # typst is slow to run unoptimized; keep dev builds usable

[profile.release]
opt-level = 3
# Typst layout is the whole cost of a compile, and it is spread across a dozen
# crates calling each other in tight loops — exactly the shape link-time
# optimisation exists for. Measured on a 48-page sefer, one edit recompiled:
# 258ms without it, 175ms with. That is a third off every keystroke-driven
# render, for a line of build configuration.
#
# `thin` and not `fat`: measured against each other they are the same speed here
# (169-185ms against 188-210ms, inside the noise), and fat relinks every test
# binary from scratch — it turned `cargo test --release` into a quarter of an
# hour. A test suite nobody wants to run is a worse trade than the 5% that was
# never there.
lto = "thin"
