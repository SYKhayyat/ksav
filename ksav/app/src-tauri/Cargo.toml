[package]
name = "app"
version = "0.1.1"
description = "Ksav — Hebrew-first writing and typesetting on real Typst"
authors = ["The Ksav Authors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/SYKhayyat/ksav"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# `build.rs` reads tauri.conf.json to check its Content-Security-Policy against
# ksav/policy/csp.txt — see the note at the top of that file for what the two
# copies had already cost.
serde_json = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
ksav-engine = { path = "../../engine" }
# The deep link parser, and the loopback types. The same crate the engine's
# desk is built on, so the two ends of `ksav://insert` cannot disagree — which
# is why the rev below has to be the one `engine/Cargo.toml` names, and why
# `engine/tests/manifests.rs` fails when it is not. See that file for why this
# is a git dependency pinned by SHA rather than the sibling path it was.
girsa-post = { version = "=0.5.3", git = "https://github.com/SYKhayyat/sefer-crates", rev = "d869ccc5251e6168f7e42dbc1db094a5cd631047" }
tauri-plugin-deep-link = "2.4.9"

# The other half of the deep link, and the half a writer meets.
#
# On Windows and Linux the deep-link plugin only ever hears a *cold* start.
# Handing a URL to a process that is already running is this plugin's job, and it
# is documented as deep-link's companion on those platforms; it was simply never
# added. So with Ksav open, `ksav://insert?packet=…` started a **second Ksav**,
# and what that costs here is not one misdelivered quote:
#
#   * `post::INBOX` is a process-local `static`, so the packet waits in a window
#     the writer is not typing in — the send looks like it did nothing.
#   * `Desk::open` binds a fresh port and `publish()`es the endpoint file
#     unconditionally, so the duplicate **takes over the pairing**. From that
#     moment every send from Girsa goes to the duplicate, including the loopback
#     route that has nothing to do with deep links. When the duplicate is closed
#     its `Desk` drop withdraws the endpoint file, and Girsa then reports that
#     Ksav is not running while the writer is looking straight at it.
#
# With the `deep-link` feature the second process's argv is handed to the
# listener already wired in `run()`, so there is no second delivery route to keep
# in step with it. macOS routes URLs through the app delegate and needs neither,
# which is why this is a targeted dependency rather than a plain one.
#
# `engine/tests/manifests.rs` holds every manifest in the tree to this pairing,
# so a shell that grows a deep link later cannot ship without it.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# The desktop binary compiles Typst in-process, so it wants the same treatment
# the engine's own release profile gets — and a crate does not inherit another
# crate's profile, so without this the installer everybody downloads was the one
# build of the three running un-optimised-across-crates layout code. Worth a
# third of every render on the desktop; see the note in engine/Cargo.toml for the
# measurement and for why this is `thin`.
[profile.release]
opt-level = 3
lto = "thin"
strip = true
