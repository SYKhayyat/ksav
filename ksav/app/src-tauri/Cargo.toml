[package]
name = "app"
version = "0.1.0"
description = "Ksav — Hebrew-first writing and typesetting on real Typst"
authors = ["The Ksav Authors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/SYKhayyat/ksav"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
ksav-engine = { path = "../../engine" }
# The deep link parser, and the loopback types. The same crate the engine's
# desk is built on, so the two ends of `ksav://insert` cannot disagree.
girsa-post = { version = "=0.3.0", path = "../../../../sefer-crates/crates/girsa-post" }
tauri-plugin-deep-link = "2.4.9"
