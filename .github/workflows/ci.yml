# Run the tests on every push and pull request.
#
# `release.yml` builds installers when a tag is pushed. Nothing ran on ordinary
# pushes, so nothing has ever been checked by anything but a person remembering
# to — and since there was no remote at all, not even that. The moment a remote
# exists this is the file that starts earning its keep.
#
# Deliberately not the release matrix: this has to be fast enough that people
# wait for it. It builds the engine once on Linux and runs everything.

name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # tags are release.yml's job
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same branch. There is no
  # value in finishing a check of code that has already been replaced.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: editor
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ksav/app/package-lock.json
      - name: Install
        working-directory: ./ksav/app
        run: npm ci
      - name: Typecheck
        working-directory: ./ksav/app
        run: npx tsc --noEmit
      - name: Test
        working-directory: ./ksav/app
        run: npm test
      - name: Build
        working-directory: ./ksav/app
        run: npx vite build

  engine:
    name: engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # The workspace builds the whole Typst compiler, which is not a quick
      # compile from cold.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/engine -> target"

      # The engine's own standard is 0 warnings; enforce it rather than trust it.
      - name: Clippy
        working-directory: ./ksav/engine
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: ./ksav/engine
        run: cargo test --release

  wasm:
    name: browser engine
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/wasm -> target"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ksav/app/package-lock.json
      - uses: jetli/wasm-pack-action@v0.4.0

      # The in-browser build is one of the three ways Ksav ships, and it was the
      # only one nothing checked: `app/src/wasmpkg/` is git-ignored and built
      # locally, so the whole no-server path could break and every job here would
      # still be green. Building it is most of the value — `wasm32-unknown-unknown`
      # is a genuinely different target, and the engine reaching for threads, the
      # filesystem or the clock fails here and nowhere else.
      - name: Build the wasm engine
        working-directory: ./ksav/wasm
        run: wasm-pack build --target web --release --out-dir pkg

      - name: Install
        working-directory: ./ksav/app
        run: npm ci

      # `build:wasm` is the offline bundle, and it is a different Vite graph from
      # the default build: the worker chunk and the engine module are only pulled
      # in when VITE_WASM=1, so the default build passing says nothing about it.
      - name: Bundle the offline build
        working-directory: ./ksav/app
        run: |
          mkdir -p src/wasmpkg
          cp ../wasm/pkg/ksav_wasm.js ../wasm/pkg/ksav_wasm.d.ts src/wasmpkg/
          cp ../wasm/pkg/ksav_wasm_bg.wasm ../wasm/pkg/ksav_wasm_bg.wasm.d.ts src/wasmpkg/
          npm run build:wasm

      # Proves the module actually runs, not merely that it linked: compile every
      # bundled template through the wasm engine and check the spell-checker
      # answers. A wasm binary that instantiates and then panics on first use
      # would pass every step above this one.
      - name: Run the engine
        working-directory: ./ksav/app
        run: node ../../.github/scripts/wasm-smoke.mjs

  desktop:
    name: desktop shell
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # libappindicator3-dev and libayatana-appindicator3-dev CONFLICT: the
      # ayatana package Replaces: the old one, so asking for both makes apt exit
      # 100 and the job never reaches a compiler. Tauri v2 wants ayatana; install
      # only that. (The Docker packaging script already learned this; this file
      # had not.)
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ksav/app/src-tauri -> target"
      # Compiles the Tauri commands and runs the path-allowlist tests. The
      # bundlers are release.yml's job; this only has to prove the shell builds.
      - name: Test
        working-directory: ./ksav/app/src-tauri
        run: cargo test
