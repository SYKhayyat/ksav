[package]
name = "ksav_engine"
version = "1.0.0"
edition = "2021"
authors = ["Ksav Team <team@ksav.app>"]
description = "High-performance Hebrew typesetting and parser engine for Ksav"

[lib]
name = "ksav_engine"
crate-type = ["cdylib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
