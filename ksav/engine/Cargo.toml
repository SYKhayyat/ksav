[package]
name = "ksav-engine"
version = "0.1.0"
edition = "2021"
description = "Hebrew-first typesetting engine built on real Typst compilation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SYKhayyat/ksav"
# The six fonts under assets/fonts are separately licensed (OFL 1.1 / GUST);
# see THIRD-PARTY-NOTICES.md at the repository root.

[lib]
name = "ksav_engine"
path = "src/lib.rs"

[[bin]]
name = "ksav"
path = "src/main.rs"

[dependencies]
typst = "0.15"
typst-layout = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
typst-html = "0.15"
typst-as-lib = { version = "0.16", features = ["typst-html"] }
ecow = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# The Source Packet -- the contract with Girsa, the library half of the pair.
# Pinned exactly: sefer-crates is a separate repository, so taking a new
# version has to be a deliberate act on this side. Its CI builds this crate
# against every proposed change, so a break shows up there rather than here.
girsa-source = { version = "=0.5.0", path = "../../../sefer-crates/crates/girsa-source" }
# The markup writer, shared so that Girsa's Ksav buffer writes the same
# commands this engine compiles (spec.md §10.3).
girsa-ksav = { version = "=0.5.0", path = "../../../sefer-crates/crates/girsa-ksav" }
include_dir = { version = "0.7", optional = true }
# Typst's own editor-support crate, for `src/jump.rs`. It is what turns a click
# on the page into a place in the source and back, by walking the laid-out frames
# for the span each glyph came from. Nothing else can answer that question: the
# spans exist only inside a compiled document, and the alternative — guessing
# from the scroll position — is what this replaced.
typst-ide = "0.15"

# The HTTP server (net + threads) is native-only; wasm builds skip it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
# The loopback to Girsa: token-gated, localhost only. Native-only for the same
# reason as the server above — a browser build has no listener and nothing to
# be handed a source by.
girsa-post = { version = "=0.5.0", path = "../../../sefer-crates/crates/girsa-post" }

[features]
# Embed the built SPA (ksav/app/dist) into the binary. Build the app first
# (`npm run build` in ksav/app), then `cargo build --features embed-ui`.
embed-ui = ["dep:include_dir"]

[profile.dev]
opt-level = 1        # typst is slow to run unoptimized; keep dev builds usable

[profile.release]
opt-level = 3
# Typst layout is the whole cost of a compile, and it is spread across a dozen
# crates calling each other in tight loops — exactly the shape link-time
# optimisation exists for. Measured on a 48-page sefer, one edit recompiled:
# 258ms without it, 175ms with. That is a third off every keystroke-driven
# render, for a line of build configuration.
#
# `thin` and not `fat`: measured against each other they are the same speed here
# (169-185ms against 188-210ms, inside the noise), and fat relinks every test
# binary from scratch — it turned `cargo test --release` into a quarter of an
# hour. A test suite nobody wants to run is a worse trade than the 5% that was
# never there.
lto = "thin"
