[package]
name = "ksav-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly binding for the Ksav engine — real Typst in the browser"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SYKhayyat/ksav"

[lib]
crate-type = ["cdylib"]

[dependencies]
ksav-engine = { path = "../engine" }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
# Make chrono's Utc::now() work in the browser (typst-as-lib reads the date).
chrono = { version = "0.4", features = ["wasmbind"] }

[profile.release]
opt-level = "s"
lto = true
