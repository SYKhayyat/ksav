<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>כְּתָב · Ksav</title>
<style>
  :root {
    --bg: #f3f4f6; --panel: #ffffff; --ink: #111827; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --accent-soft: #eff6ff; --danger: #b91c1c;
    --mono: "Cascadia Code", "Consolas", ui-monospace, monospace;
    --hebrew: "Frank Ruhl Libre", "David Libre", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--hebrew); background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }

  header {
    display: flex; align-items: center; gap: 14px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .5px; }
  .brand small { color: var(--muted); font-weight: 400; font-size: 12px; margin-inline-start: 6px; }
  .spacer { flex: 1; }

  .toolbar { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .toolbar button, .bar button {
    font-family: var(--hebrew); font-size: 13px; padding: 5px 10px; cursor: pointer;
    background: #fff; border: 1px solid var(--line); border-radius: 7px; color: var(--ink);
  }
  .toolbar button:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .toolbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  label.ctl { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  label.ctl select, label.ctl input { font-family: var(--hebrew); font-size: 12px; padding: 3px 5px; border: 1px solid var(--line); border-radius: 6px; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .pane { min-height: 0; display: flex; flex-direction: column; }
  .pane.source { border-inline-start: 1px solid var(--line); }
  .pane-head { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted);
               padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }

  #editor {
    flex: 1; width: 100%; resize: none; border: 0; outline: none; padding: 18px;
    font-family: var(--mono); font-size: 15px; line-height: 1.7; direction: rtl; text-align: right;
    background: #fbfbfd; color: var(--ink);
  }

  #preview { flex: 1; overflow: auto; padding: 22px; background: var(--bg); }
  .page { background: #fff; margin: 0 auto 22px; box-shadow: 0 2px 14px rgba(0,0,0,.12); max-width: 820px; }
  .page svg { width: 100%; height: auto; display: block; }

  .bar { display: flex; align-items: center; gap: 12px; padding: 6px 14px; background: var(--panel);
         border-top: 1px solid var(--line); font-size: 13px; min-height: 34px; }
  .status-ok { color: #15803d; } .status-err { color: var(--danger); }
  #diagnostics { color: var(--danger); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; flex: 1; }
</style>
</head>
<body>
  <header>
    <div class="brand">כְּתָב<small>Ksav · Typst אמיתי</small></div>
    <div class="toolbar" id="toolbar">
      <button data-wrap="הדגשה" title="מודגש"><b>ב</b></button>
      <button data-wrap="נטוי" title="נטוי"><i>נ</i></button>
      <button data-wrap="קו_תחתון" title="קו תחתון"><u>ק</u></button>
      <span class="sep"></span>
      <button data-wrap="כותרת1" title="כותרת ראשית">כותרת 1</button>
      <button data-wrap="כותרת2" title="כותרת משנה">כותרת 2</button>
      <span class="sep"></span>
      <button data-insert="#רשימה(\n  פריט[],\n  פריט[],\n)" title="רשימה">• רשימה</button>
      <button data-insert="#ממוספרת(\n  פריט[],\n  פריט[],\n)" title="ממוספרת">1. ממוספרת</button>
      <button data-insert="#טבלה(\n  עמודות: 2,\n  תא[], תא[],\n  תא[], תא[],\n)" title="טבלה">טבלה</button>
      <button data-wrap="הערה" title="הערת שוליים">הערה</button>
      <span class="sep"></span>
      <button data-wrap="מרכז" title="מרכז">מרכז</button>
    </div>
    <div class="spacer"></div>
    <label class="ctl">גופן
      <select id="font">
        <option value="Frank Ruhl Hofshi">Frank Ruhl</option>
        <option value="David Libre">David</option>
      </select>
    </label>
    <label class="ctl">גודל <input id="size" type="number" min="8" max="36" step="1" value="12" style="width:52px"></label>
    <label class="ctl">שוליים <input id="margin" type="number" min="1" max="6" step="0.5" value="2.5" style="width:56px"></label>
    <button id="download" class="">הורד PDF ⬇</button>
  </header>

  <main>
    <section class="pane">
      <div class="pane-head">תצוגה מקדימה · live preview</div>
      <div id="preview"></div>
    </section>
    <section class="pane source">
      <div class="pane-head">מקור · source</div>
      <textarea id="editor" spellcheck="false"></textarea>
    </section>
  </main>

  <div class="bar">
    <span id="status" class="status-ok">מוכן</span>
    <span id="diagnostics"></span>
  </div>

<script src="editor.js"></script>
</body>
</html>
